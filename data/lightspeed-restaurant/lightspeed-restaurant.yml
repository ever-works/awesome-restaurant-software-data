markdown: >-
  ## Overview


  Lightspeed Restaurant is a cloud-based point of sale and restaurant management
  platform built for hospitality businesses of all sizes, from single-location
  restaurants to multi-location groups and hotel restaurants.


  ## Key Features


  - Cloud-based POS with offline mode (data syncs automatically when connection
  is restored)

  - Customizable menus, screens, and floor plans

  - Tableside POS with handheld devices

  - QR code ordering and online ordering

  - Multi-location management with unified guest data and reporting

  - Hotel PMS integration for charge-to-room functionality

  - Inventory management tools

  - Payroll and workforce management including scheduling, labor forecasting,
  and tip management

  - Advanced reporting and business intelligence

  - Embedded payment processor (Lightspeed Payments) with flat-rate pricing

  - Partner API access and integrations with third-party tools (e.g., 7shifts,
  OpenTable)

  - 24/7 phone and chat support


  ## Pricing


  Pricing varies by subscription tier. Lightspeed offers Starter, Essential, and
  Premium plans. Specific pricing is quote-based and depends on the number of
  locations and operational requirements.


  ## Deployment


  Cloud-based with local offline capability.
